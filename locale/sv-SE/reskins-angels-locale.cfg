[mod-setting-description]
reskins-angels-do-angelsbioprocessing=Ger nya utseenden åt mellankomponenterna, recepten och teknologierna samt algodlingen, arboretet, bioprocessorn, slakteriet, komposteraren, odlingarna, kläckeriet, näringsextraktorn, pressen, refugierna, trädfrögeneratorerna och fröextraktorerna från Angel's Bioprocessing.
# reskins-angels-do-angelsexploration=This string is not yet used; do not translate.
reskins-angels-do-angelsindustries=Ger nya utseenden åt de stora kistorna och stora logistikkistorna från Angel's Industries.
reskins-angels-do-angelspetrochem=Ger nya utseenden åt mellankomponenterna, recepten och teknologierna samt kemifabrikerna, luftfiltren, elektrolysörerna, gasraffinaderierna, ångkrackningsanläggningarna och olje- och gasseparatorerna från Angel's Petrochemical Processing.
reskins-angels-do-angelsrefining=Ger nya utseenden åt mellankomponenterna, recepten och teknologierna samt kristallisatorn, den elektrolytiska utvinningscellen, filtreringsenheten, vattenreningsanläggningen, förvätskaren, malmkrossen, malmflotationscellen, malmlakningsanläggningen, malmpulverkvarnen, malmraffinaderiet, malmsorteringsanläggningen, saltanläggningen och tvättanläggningen från Angel's Refining.
reskins-angels-do-angelssmelting=Ger nya utseenden åt plåtarna, tackorna, malmerna och andra mellankomponenter, recepten och teknologierna samt gjutmaskinerna, ugnarna, malmbearbetningsmaskinerna, pelletspressarna, pulverblandarna och sintringsugnarna från Angel's Smelting.
# reskins-angels-do-angelsaddons-cab=This string is not yet used; do not translate.
# reskins-angels-do-angelsaddons-mobility=This string is not yet used; do not translate.
reskins-angels-do-angelsaddons-storage=Ger nya utseenden åt malmsilorna och lagren, logistiksilorna och logistiklagren samt lagringstankarna från Angel's Addons - Storage Options.

reskins-angels-use-angels-material-colors=Ger kugghjul, lager och lagerkulor färger enligt Angel's materialfärger.\n\nTill exempel blir nitinolkugghjul lila i stället för mörkgrå.
reskins-angels-use-angels-material-colors-pipes=Ger rör färger enligt Angel's materialfärger.\n\nTill exempel blir nitinolrör lila i stället för mörkgrå.

reskins-angels-use-angels-tier-colors=Ger nivåindelade byggnader och föremål färger enligt Angel's nivåfärger.\n\nÅsidosätts av ”Aktivera egna färger”.
reskins-angels-belts-use-angels-tier-colors=Transportband och tillhörande objekt använder Angel's nivåfärger när ”__1__” är aktiverat.\n\nÅsidosätts av ”Aktivera egna färger”.
reskins-angels-use-vanilla-style-ores=Ersätter Angel's spritebilder för malmerna Saphirite, Stiratite, Jivolite, Crotinnium, Rubyte och Bobmonium med bilder i grundspelets stil.
reskins-angels-use-item-variations=Låter tackor ligga på flera olika sätt när de placeras på transportband eller på marken, ungefär som utvunnen malm.
reskins-angels-use-vanilla-chemical-plant-sprites=Kemifabriker i Angel's stil använder grundspelets spritebilder och animationer om grundspelets kemifabriker är inaktiverade.

reskins-bobs-mixing-furnace-color=Ställer in färgen för filtreringsugnen av sten, filtreringsugnarna av stål och med vätskebränsle samt den elektriska filtreringsugnen.

