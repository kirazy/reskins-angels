[mod-name]
reskins-angels=Artisanal Reskins: Angel's Mods

[mod-description]
reskins-angels=Ger föremål, objekt och teknologier i Angel's moddar nya utseenden med nivåfärger och ikonmarkeringar. Innehåller högupplösta ikoner och uppdaterade modeller, belysning och spritebilder, samt nivåmarkeringar, färger och nivåindelning som spelaren kan anpassa. Ingår i serien Artisanal Reskins.

[mod-setting-name]

reskins-angels-use-angels-material-colors=Använd Angel's materialfärger för mellankomponenter
reskins-angels-use-angels-material-colors-pipes=Använd Angel's materialfärger för rör

reskins-angels-use-angels-tier-colors=Använd Angel's nivåfärger
reskins-angels-belts-use-angels-tier-colors=Transportband använder Angel's nivåfärger
reskins-angels-use-vanilla-style-ores=Använd malmer i grundspelets stil
reskins-angels-use-item-variations=Föremålsvarianter
reskins-angels-use-vanilla-chemical-plant-sprites=Använd kemifabriker i grundspelets stil

reskins-bobs-mixing-furnace-color=Färg: filtreringsugnar

[mod-setting-description]
# reskins-angels-do-angelsaddons-cab=This string is not yet used; do not translate.
# reskins-angels-do-angelsaddons-mobility=This string is not yet used; do not translate.

reskins-angels-use-angels-material-colors=Ger kugghjul, lager och lagerkulor färger enligt Angel's materialfärger.\n\nTill exempel blir nitinolkugghjul lila i stället för mörkgrå.
reskins-angels-use-angels-material-colors-pipes=Ger rör färger enligt Angel's materialfärger.\n\nTill exempel blir nitinolrör lila i stället för mörkgrå.

reskins-angels-use-angels-tier-colors=Ger nivåindelade byggnader och föremål färger enligt Angel's nivåfärger.\n\nÅsidosätts av ”Aktivera egna färger”.
reskins-angels-belts-use-angels-tier-colors=Transportband och tillhörande objekt använder Angel's nivåfärger när ”__1__” är aktiverat.\n\nÅsidosätts av ”Aktivera egna färger”.
reskins-angels-use-vanilla-style-ores=Ersätter Angel's spritebilder för malmerna Saphirite, Stiratite, Jivolite, Crotinnium, Rubyte och Bobmonium med bilder i grundspelets stil.
reskins-angels-use-item-variations=Låter tackor ligga på flera olika sätt när de placeras på transportband eller på marken, ungefär som utvunnen malm.
reskins-angels-use-vanilla-chemical-plant-sprites=Kemifabriker i Angel's stil använder grundspelets spritebilder och animationer om grundspelets kemifabriker är inaktiverade.

reskins-bobs-mixing-furnace-color=Ställer in färgen för filtreringsugnen av sten, filtreringsugnarna av stål och med vätskebränsle samt den elektriska filtreringsugnen.

